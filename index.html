<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>寿险产品评分详情</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --sub:#6b7280;
      --line:#e5e7eb;
      --blue:#2563eb;
      --blue-light:#eff6ff;
      --green:#16a34a;
      --green-light:#dcfce7;
      --orange:#d97706;
      --orange-light:#fef3c7;
      --red:#dc2626;
      --red-light:#fee2e2;
      --gray-light:#f8fafc;
      --shadow:0 10px 30px rgba(15,23,42,.06);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      line-height:1.6;
    }

    .page{
      max-width:1180px;
      margin:0 auto;
      padding:28px 20px 40px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:18px;
    }

    .section-title{
      font-size:16px;
      font-weight:800;
      margin:0 0 16px;
      color:#111827;
    }

    /* 顶部信息区 */
    .hero{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:18px;
    }

    .hero-left h1{
      margin:0 0 10px;
      font-size:34px;
      line-height:1.25;
      font-weight:900;
    }

    .hero-sub{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      color:var(--sub);
      font-size:14px;
    }

    .hero-sub .dot{
      width:4px;
      height:4px;
      border-radius:50%;
      background:#cbd5e1;
      display:inline-block;
    }

    .hero-right{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
      min-width:320px;
    }

    .summary-chip{
      display:flex;
      align-items:center;
      gap:8px;
      padding:12px 16px;
      border-radius:14px;
      font-size:14px;
      font-weight:700;
      border:1px solid transparent;
      white-space:nowrap;
    }

    .summary-chip strong{
      font-size:18px;
      font-weight:900;
    }

    .chip-score{
      background:var(--blue-light);
      color:var(--blue);
      border-color:#bfdbfe;
    }

    .chip-rank{
      background:#f3f4f6;
      color:#111827;
      border-color:#e5e7eb;
    }

    .chip-grade{
      background:var(--green-light);
      color:var(--green);
      border-color:#bbf7d0;
    }

    .grade-pill,
    .rank-pill,
    .score-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:34px;
      height:34px;
      padding:0 12px;
      border-radius:999px;
      font-size:14px;
      font-weight:800;
    }

    .grade-pill.S{
      background:var(--green-light);
      color:var(--green);
    }
    .grade-pill.A{
      background:#dbeafe;
      color:#1d4ed8;
    }
    .grade-pill.B{
      background:var(--orange-light);
      color:var(--orange);
    }
    .grade-pill.C{
      background:var(--red-light);
      color:var(--red);
    }

    .rank-pill{
      background:#eef2ff;
      color:#4338ca;
    }

    .score-pill{
      background:#eff6ff;
      color:#1d4ed8;
    }

    /* 基本信息 */
    .basic-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .basic-item{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:14px 16px;
      min-height:84px;
    }

    .basic-item .label{
      color:var(--sub);
      font-size:12px;
      margin-bottom:8px;
    }

    .basic-item .value{
      font-size:22px;
      font-weight:800;
      color:#111827;
      line-height:1.35;
    }

    .basic-item .value.small{
      font-size:16px;
      font-weight:700;
    }

    /* 优势短板 */
    .two-col{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .highlight-list{
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .highlight-list li{
      display:flex;
      align-items:flex-start;
      gap:12px;
      padding:12px 14px;
      border-radius:14px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
    }

    .highlight-icon{
      width:28px;
      height:28px;
      flex:0 0 28px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      font-size:14px;
      font-weight:900;
      margin-top:2px;
    }

    .positive .highlight-icon{
      background:var(--green-light);
      color:var(--green);
    }

    .negative .highlight-icon{
      background:var(--red-light);
      color:var(--red);
    }

    .highlight-text{
      font-size:15px;
      font-weight:600;
      color:#1f2937;
    }

    /* 一级+二级 */
    .bottom-grid{
      display:grid;
      grid-template-columns:360px 1fr;
      gap:18px;
      align-items:start;
    }

    .metric-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .metric-card{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:14px 16px;
    }

    .metric-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
    }

    .metric-name{
      font-weight:700;
      color:#111827;
      font-size:15px;
    }

    .metric-score{
      font-weight:800;
      color:#111827;
      font-size:14px;
    }

    .meter{
      height:10px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin-bottom:8px;
    }

    .meter > span{
      display:block;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#2563eb,#60a5fa);
    }

    .metric-bottom{
      display:flex;
      justify-content:space-between;
      font-size:12px;
      color:var(--sub);
    }

    /* 表格 */
    .table-wrap{
      overflow:auto;
      border:1px solid #e5e7eb;
      border-radius:14px;
      max-height:560px;
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:13px;
    }

    thead th{
      position:sticky;
      top:0;
      z-index:2;
      background:#f8fafc;
      color:#111827;
      font-weight:800;
      text-align:left;
      padding:12px 12px;
      border-bottom:1px solid #e5e7eb;
      white-space:nowrap;
    }

    tbody td{
      padding:11px 12px;
      border-bottom:1px solid #eef2f7;
      vertical-align:middle;
      color:#374151;
    }

    tbody tr:nth-child(even){
      background:#fcfdff;
    }

    tbody tr:hover{
      background:#f9fbff;
    }

    .score-badge{
      display:inline-flex;
      min-width:28px;
      height:28px;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      padding:0 8px;
    }

    .score-5{background:#dcfce7;color:#166534;}
    .score-4{background:#dbeafe;color:#1d4ed8;}
    .score-3{background:#fef3c7;color:#92400e;}
    .score-2{background:#fee2e2;color:#b91c1c;}
    .score-1{background:#ffe4e6;color:#be123c;}
    .score-0{background:#e5e7eb;color:#4b5563;}

    .contribution{
      font-weight:800;
      color:#111827;
    }

    .muted{
      color:var(--sub);
      font-size:13px;
    }

    .footer-note{
      text-align:center;
      color:#6b7280;
      font-size:13px;
      margin-top:16px;
    }

    @media (max-width: 960px){
      .hero{
        flex-direction:column;
      }
      .hero-right{
        justify-content:flex-start;
        min-width:auto;
      }
      .basic-grid{
        grid-template-columns:1fr 1fr;
      }
      .two-col,
      .bottom-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 640px){
      .page{
        padding:18px 14px 28px;
      }
      .hero-left h1{
        font-size:26px;
      }
      .basic-grid{
        grid-template-columns:1fr;
      }
      .summary-chip{
        width:100%;
        justify-content:space-between;
      }
    }
  </style>
</head>

    <div class="hero">
      <div class="hero-left">
        <h1 id="heroName">寿险产品评分详情</h1>
        <div class="hero-sub">
          <span id="heroCompany">--</span>
          <span class="dot"></span>
          <span id="heroSpu">--</span>
        </div>
      </div>

      <div class="hero-right">
        <div class="summary-chip chip-grade">

          <span class="grade-pill S" id="heroGrade">S</span>

    <div class="two-col">

      <div class="card">

    <!-- 一级 / 二级 -->
    <div class="bottom-grid">

                <th>二级权重</th>
                <th>贡献分</th>
              </tr>
            </thead>
            <tbody id="detailBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="footer-note">
      免责声明：本页面仅基于当前 mock 数据和评分规则进行演示，不构成投保建议、承保结论或收益承诺。
    </div>
  </div>

    function qs(k){
      return new URLSearchParams(location.search).get(k);
    }

    function normalizeGrade(grade, totalScore){
      // 兼容旧数据（优秀/良好/关注/不佳）和新数据（S/A/B/C）
      if (grade === "S" || grade === "A" || grade === "B" || grade === "C") return grade;
      if (grade === "优秀") return "S";
      if (grade === "良好") return "A";
      if (grade === "关注") return "B";
      if (grade === "不佳") return "C";

      const s = Number(totalScore || 0);
      if (s >= 90) return "S";
      if (s >= 75) return "A";
      if (s >= 60) return "B";
      return "C";
    }

    function gradeClass(grade){
      return normalizeGrade(grade, 0);
    }

    function safeText(v){
      return v === null || v === undefined || v === "" ? "--" : String(v);
    }

    function num(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function scoreBadge(score){
      const s = Math.max(0, Math.min(5, Number(score)));
      return `<span class="score-badge score-${s}">${s}</span>`;
    }

      t = t.replace(/，原始值为.*$/,'');
      t = t.replace(/，得\d+分。?$/,'');
      t = t.replace(/原始值为.*$/,'');
      t = t.replace(/得\d+分。?$/,'');
      t = t.replace(/相对需要关注/g,'需关注');
      t = t.replace(/表现较好/g,'表现突出');
      t = t.replace(/。$/,'');
      return t;
    }

    function buildAdvantages(data){
      if (Array.isArray(data.advantages) && data.advantages.length){
        return data.advantages.slice(0,3).map(x => cleanSummaryText(x, "adv"));
      }
      return [];
    }

    function buildWeaknesses(data){
      if (Array.isArray(data.weaknesses) && data.weaknesses.length){
        return data.weaknesses.slice(0,3).map(x => cleanSummaryText(x, "weak"));
      }
      return [];
    }

    function renderBasicInfo(d){
      const grade = normalizeGrade(d.grade, d.total_score);
      const html = [
        ["产品名称", safeText(d.product_name), ""],
        ["险种类型", safeText(d.insurance_type), ""],
        ["SPU_ID", safeText(d.spu_id), ""],
        ["承保公司", safeText(d.company_name), ""],
        ["综合得分", `<span class="score-pill">${safeText(d.total_score)}</span>`, "html"],
        ["评级", `<span class="grade-pill ${gradeClass(grade)}">${grade}</span>`, "html"],
        ["当前排名", `<span class="rank-pill">第${safeText(d.rank)}名</span>`, "html"]
      ].map(item => `
        <div class="basic-item">
          <div class="label">${item[0]}</div>
          <div class="value ${item[2] === 'html' ? 'small' : ''}">
            ${item[2] === 'html' ? item[1] : safeText(item[1])}
          </div>
        </div>
      `).join("");
      document.getElementById("basicGrid").innerHTML = html;
    }

    function renderLevel1(d){
      const html = (d.level1_scores || []).map(item => {
        const score = num(item.score);
        const full = num(item.full_score);
        const percent = full > 0 ? Math.round(score / full * 100) : 0;
        return `
          <div class="metric-card">
            <div class="metric-top">
              <div class="metric-name">${safeText(item.level1_name)}</div>
              <div class="metric-score">${score}/${full}</div>
            </div>
            <div class="meter"><span style="width:${Math.min(percent,100)}%"></span></div>
            <div class="metric-bottom">
              <span>达成率</span>
              <span>${percent}%</span>
            </div>
          </div>
        `;
      }).join("");
      document.getElementById("level1List").innerHTML = html;
    }

    function renderHighlights(listId, items, symbol){
      const html = (items || []).map(text => `
        <li>
          <div class="highlight-icon">${symbol}</div>
          <div class="highlight-text">${safeText(text)}</div>
        </li>
      `).join("");
      document.getElementById(listId).innerHTML = html || `<li><div class="highlight-text muted">暂无数据</div></li>`;
    }

    function renderDetails(d){
      const html = (d.detail_scores || []).map(item => `
        <tr>
          <td>${safeText(item.level1_name)}</td>
          <td>${safeText(item.level2_name)}</td>
          <td>${safeText(item.raw_value)}</td>
          <td>${scoreBadge(item.score_0_5)}</td>
          <td>${Math.round(num(item.level2_weight) * 100)}%</td>
          <td class="contribution">${safeText(item.contribution)}</td>
        </tr>
      `).join("");
      document.getElementById("detailBody").innerHTML = html;
    }

    function render(data){
      const grade = normalizeGrade(data.grade, data.total_score);

      document.getElementById("heroName").textContent = safeText(data.product_name);
      document.getElementById("heroCompany").textContent = safeText(data.company_name);
      document.getElementById("heroSpu").textContent = safeText(data.spu_id);
      if (data.insurance_type) { document.getElementById("heroCompany").textContent = safeText(data.company_name) + " · " + safeText(data.insurance_type); }

      document.getElementById("heroGrade").textContent = grade;
      document.getElementById("heroGrade").className = `grade-pill ${gradeClass(grade)}`;
      document.getElementById("heroRank").textContent = `第${safeText(data.rank)}名`;
      document.getElementById("heroScore").textContent = safeText(data.total_score);

      renderBasicInfo(data);
      renderLevel1(data);
      renderHighlights("advList", buildAdvantages(data), "✓");
      renderHighlights("weakList", buildWeaknesses(data), "!");
      renderDetails(data);
    }

    function renderNotFound(id){
      document.getElementById("heroName").textContent = "未找到产品评分详情";
      document.getElementById("heroCompany").textContent = "当前 Demo 页面未内置该产品数据";
      document.getElementById("heroSpu").textContent = safeText(id);

      document.getElementById("heroGrade").textContent = "--";
      document.getElementById("heroRank").textContent = "--";
      document.getElementById("heroScore").textContent = "--";

      document.getElementById("basicGrid").innerHTML = `
        <div class="basic-item" style="grid-column:1 / -1;">
          <div class="label">提示</div>
          <div class="value small">暂未找到 ${safeText(id)} 的详情数据。当前支持：${Object.keys(DATA).join("、")}</div>
        </div>
      `;
      document.getElementById("advList").innerHTML = "";
      document.getElementById("weakList").innerHTML = "";
      document.getElementById("level1List").innerHTML = "";
      document.getElementById("detailBody").innerHTML = "";
    }

    const currentId = qs("spu_id") || "2032951851";
    if (DATA[currentId]) {
      render(DATA[currentId]);
    } else {
      renderNotFound(currentId);
    }
  </script>
</body>
</html>
